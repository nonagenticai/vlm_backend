[project]
license = "Apache-2.0"
name = "vlm-backend"
version = "0.1.0"
description = "VLM (vision-language model) inference backend for Apple Silicon — mlx-vlm"
requires-python = ">=3.14"
dependencies = [
    # Hold <0.137: fastapi 0.137 puts _IncludedRouter (no .path) into app.routes,
    # which crashes prometheus-fastapi-instrumentator 8.0.0 (latest) route-name lookup.
    "fastapi>=0.115.0,<0.166",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.2.2",
    "psutil>=6.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "Pillow>=13.0.0",
    "httpx>=0.28.1",  # for fetching image URLs in OpenAI-style payloads + license introspection
    "cachetools>=5.5.0",
    # Apple-Silicon-only deps (sys_platform-gated)
    "mlx>=0.29.4 ; sys_platform == 'darwin'",
    "mlx-vlm>=0.1.10 ; sys_platform == 'darwin'",
    "transformers>=5.10.0 ; sys_platform == 'darwin'",
    # transformers' Qwen2-VL processor hard-requires torch + torchvision at runtime
    "torch>=2.13.0 ; sys_platform == 'darwin'",
    "torchvision>=0.19.0 ; sys_platform == 'darwin'",
    "numpy>=1.24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}

[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
    "ruff>=0.15",
    "ty>=0.0.32",
    "bandit>=1.8.0",
    "pip-audit>=2.9.0",
    "detect-secrets>=1.5.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["__pycache__", ".venv", "logs"]

[tool.ruff.lint]
select = ["F", "E", "W", "B", "UP", "I", "S", "BLE"]
ignore = ["S101", "S104", "B008"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.ruff.format]
quote-style = "double"

[tool.local-ci]
skip_tests = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
markers = ["unit: Unit tests", "integration: Integration tests"]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["src"]

[tool.ty.rules]
import-not-found = "ignore"
